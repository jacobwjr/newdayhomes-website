# Decap CMS settings. The only lines you must change are under "backend".
backend:
  name: github
  repo: YOUR-GITHUB-USERNAME/YOUR-REPO-NAME   # <- change this
  branch: main

# Where uploaded photos and floor plans are saved
media_folder: "images/uploads"
public_folder: "/images/uploads"

site_url: https://www.YOUR-DOMAIN.com
display_url: https://www.YOUR-DOMAIN.com
locale: en

collections:
  - name: inventory
    label: Floor Plans
    editor: { preview: false }
    files:
      - name: homes
        label: All Floor Plans
        file: data/homes.json
        format: json
        fields:
          - name: homes
            label: Floor plans
            label_singular: Floor plan
            widget: list
            summary: "{{fields.model}} ({{fields.type}}) · {{fields.status}}"
            collapsed: true
            fields:
              - { name: id, label: "Listing ID (short, no spaces, e.g. clayton-tempo-3br)", widget: string }
              - { name: model, label: Model name, widget: string }
              - { name: manufacturer, label: Manufacturer, widget: string, required: false }
              - { name: type, label: Home type, widget: select, options: ["Single-wide", "Double-wide", "Modular"] }
              - { name: status, label: Status, widget: select, options: ["Customizable floor plan", "Model home on our lot", "Sale pending", "Sold"], default: "Customizable floor plan" }
              - { name: show, label: Show on website, widget: boolean, default: true }
              - { name: featured, label: Feature on homepage, widget: boolean, default: false }
              - { name: beds, label: Bedrooms, widget: number, value_type: int, min: 1 }
              - { name: baths, label: Bathrooms, widget: number, value_type: float, step: 0.5, min: 1 }
              - { name: sqft, label: Square feet, widget: string }
              - { name: price, label: "Starting price (e.g. Starting at $89,900 or Call for pricing)", widget: string }
              - { name: description, label: "Description (layout highlights and popular customizations)", widget: text, required: false }
              - name: photos
                label: Photos (first photo is the main one; drag to reorder)
                label_singular: Photo
                widget: list
                required: false
                field: { name: image, label: Photo, widget: image, choose_url: false }
              - { name: floorplan, label: "Floor plan (image or PDF)", widget: file, required: false, choose_url: false }
              - { name: tour_url, label: "Video or 3D tour link (YouTube, Matterport, etc.)", widget: string, required: false }

  - name: settings
    label: Site Settings
    editor: { preview: false }
    files:
      - name: general
        label: Google reviews
        file: data/settings.json
        format: json
        fields:
          - name: google_reviews
            label: Google reviews
            widget: object
            fields:
              - { name: show, label: Show Google reviews on the website, widget: boolean, default: false }
              - { name: url, label: "Link to your Google reviews (copy it from your Google Business Profile)", widget: string, required: false }
              - { name: rating, label: "Star rating (e.g. 4.9), optional", widget: string, required: false }
              - { name: count, label: "Number of reviews (e.g. 37), optional", widget: string, required: false }
      - name: manufacturers
        label: Manufacturers ("Homes built by")
        file: data/manufacturers.json
        format: json
        fields:
          - { name: show, label: Show this section on the website, widget: boolean, default: true }
          - { name: title, label: Heading, widget: string, default: "Homes built by" }
          - name: manufacturers
            label: Manufacturers
            label_singular: Manufacturer
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { name: name, label: Manufacturer name, widget: string }
              - { name: logo, label: "Logo (optional; PNG or SVG with transparent background works best)", widget: image, required: false, choose_url: false }
              - { name: url, label: "Website link (optional)", widget: string, required: false }
      - name: hero
        label: Top of page (photo or video)
        file: data/hero.json
        format: json
        fields:
          - { name: video, label: "Video (MP4, muted loop of home interiors; 15-30 seconds, under 10 MB works best)", widget: file, required: false, choose_url: false, media_library: { config: { multiple: false } } }
          - { name: poster, label: "Still image shown while the video loads (optional; a frame from the video works well)", widget: image, required: false, choose_url: false }
          - { name: image, label: "Photo (used if there's no video)", widget: image, required: false, choose_url: false }
          - { name: alt, label: "Short description for screen readers (e.g. Tour of a custom kitchen and living room)", widget: string, required: false }
